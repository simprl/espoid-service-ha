name: Integration checks
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components
      - name: Validate runtime translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('custom_components/espoid_service/translations')
          def keys(v, prefix=''):
              if isinstance(v, str):
                  assert v.strip()
                  return {prefix}
              return set().union(*(keys(x, prefix + '.' + k) for k, x in v.items()))
          texts = {k: json.loads((p / (k + '.json')).read_text()) for k in ('en', 'uk', 'ru')}
          assert keys(texts['en']) == keys(texts['uk']) == keys(texts['ru'])
          assert texts['uk'] == texts['ru']
          PY
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
